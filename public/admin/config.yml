backend:
  name: github
  repo: robgreenwork/esco-tech-transformation
  branch: main

site_url: https://escotech.robgreen.work
display_url: https://escotech.robgreen.work
logo_url: https://escotech.robgreen.work/favicon.svg

media_folder: "public/uploads"
public_folder: "/uploads"

# Default format for all collections: YAML frontmatter + markdown body
slug:
  encoding: ascii
  clean_accents: true

collections:
  # ───────────────────────────────────────────────
  - name: home
    label: "Home page"
    label_singular: "Home section"
    files:
      - name: about
        label: "About this programme"
        file: "src/content/sections/home-about.md"
        format: frontmatter
        fields:
          - label: "Content"
            name: body
            widget: markdown

      - name: phase4
        label: "Phase 4 notice box"
        file: "src/content/sections/home-phase4-note.md"
        format: frontmatter
        fields:
          - label: "Content"
            name: body
            widget: markdown

      - name: howtouse
        label: "How to use this site"
        file: "src/content/sections/home-how-to-use.md"
        format: frontmatter
        fields:
          - label: "Content"
            name: body
            widget: markdown

  # ───────────────────────────────────────────────
  - name: phase-1
    label: "Phase 1"
    files:
      - name: hypothesis
        label: "Hypothesis"
        file: "src/content/sections/phase-1-hypothesis.md"
        format: frontmatter
        fields:
          - { label: "Content", name: body, widget: markdown }
